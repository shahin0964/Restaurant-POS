name: Production Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Production APK
    runs-on: ubuntu-latest

    steps:
      # 1. CHECKOUT REPOSITORY
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. SET UP JAVA JDK 21
      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # 3. DETERMINE GRADLE VERSION
      - name: Determine Required Gradle Version
        id: gradle_ver
        run: |
          set -euo pipefail
          REQ_VER=$(grep -oE 'gradle-[0-9.]+-' gradle/wrapper/gradle-wrapper.properties | sed -E 's/gradle-([0-9.]+)-/\1/' | head -n 1 || true)
          if [ -z "$REQ_VER" ]; then
            REQ_VER="9.3.1"
          fi
          echo "REQUIRED_GRADLE_VERSION=${REQ_VER}" >> "$GITHUB_OUTPUT"
          echo "Project requires Gradle version: ${REQ_VER}"

      # 4. INSTALL STANDALONE GRADLE DISTRIBUTION DIRECTLY
      - name: Install Standalone Gradle
        run: |
          set -euo pipefail
          GRADLE_VER="${{ steps.gradle_ver.outputs.REQUIRED_GRADLE_VERSION }}"
          echo "Downloading official standalone Gradle ${GRADLE_VER}..."
          curl -sSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o gradle-dist.zip
          sudo unzip -q gradle-dist.zip -d /opt
          sudo ln -sf "/opt/gradle-${GRADLE_VER}/bin/gradle" /usr/local/bin/gradle
          rm -f gradle-dist.zip

      # 5. DIAGNOSTIC: STANDALONE GRADLE VERSION BEFORE REGENERATION
      - name: Diagnostic - Standalone Gradle Version
        run: |
          set -euo pipefail
          gradle --version

      # 6. REGENERATE GRADLE WRAPPER
      - name: Regenerate Gradle Wrapper
        run: |
          set -euo pipefail
          GRADLE_VER="${{ steps.gradle_ver.outputs.REQUIRED_GRADLE_VERSION }}"
          echo "Removing existing wrapper JAR..."
          rm -f gradle/wrapper/gradle-wrapper.jar
          echo "Regenerating wrapper with Gradle ${GRADLE_VER}..."
          gradle wrapper --gradle-version "${GRADLE_VER}" --distribution-type bin

      # 7. VALIDATE REGENERATED GRADLE WRAPPER JAR
      - name: Validate Gradle Wrapper JAR
        run: |
          set -euo pipefail
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing or empty!"
            exit 1
          fi
          echo "Inspecting regenerated gradle-wrapper.jar contents..."
          jar tf gradle/wrapper/gradle-wrapper.jar | head -n 10
          echo "gradle-wrapper.jar is a valid JAR archive."

      # 8. DIAGNOSTIC: VERIFY GRADLEW
      - name: Diagnostic - Gradlew Version
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          sed -i -e 's/\r$//' ./gradlew || true
          ./gradlew --version

      # 9. DECODE AND PREPARE KEYSTORE
      - name: Prepare Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "Setting up release signing keystore..."

          KEYSTORE_PATH="${GITHUB_WORKSPACE}/restaurant-pos.jks"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 GitHub Secret is missing!"
            exit 1
          fi
          
          STORE_PASS="${STORE_PASSWORD:-${KEYSTORE_PASSWORD:-}}"
          if [ -z "$STORE_PASS" ]; then
            echo "::error::KEYSTORE_PASSWORD or STORE_PASSWORD GitHub Secret is missing!"
            exit 1
          fi

          if [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEY_PASSWORD GitHub Secret is missing!"
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::KEY_ALIAS GitHub Secret is missing!"
            exit 1
          fi

          # Remove only whitespace characters that may have been introduced
          # when copying the Base64 value into GitHub Secrets.
          CLEANED_BASE64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n\t ')"

          if [ -z "$CLEANED_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is empty after cleanup!"
            exit 1
          fi

          # Decode Base64 into the workspace using a temporary file.
          if ! printf '%s' "$CLEANED_BASE64" | base64 --decode > "$KEYSTORE_PATH" 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 could not be Base64-decoded!"
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file is empty!"
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          echo "Keystore Base64 decoded successfully."

          # Verify that the decoded file is an actual readable keystore
          # and that the requested alias exists.
          if ! keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" \
            > /dev/null 2>&1; then

            echo "::error::Decoded keystore is invalid, the password is incorrect, or KEY_ALIAS does not exist!"
            rm -f "$KEYSTORE_PATH"
            exit 1
          fi

          echo "Keystore and alias verification successful."

          # Export the exact absolute path for later workflow steps.
          echo "KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      # 9.5 PREPARE GOOGLE SERVICES
      - name: Prepare Google Services
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          set -euo pipefail

          if [ -f "app/google-services.json" ]; then
            echo "google-services.json already exists in the repository."
          elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "Restoring google-services.json from GOOGLE_SERVICES_JSON secret..."
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -n "${GOOGLE_SERVICES_BASE64:-}" ]; then
            echo "Restoring google-services.json from GOOGLE_SERVICES_BASE64 secret..."
            printf '%s' "$GOOGLE_SERVICES_BASE64" | base64 --decode > app/google-services.json
          else
            echo "Writing default project app/google-services.json..."
            mkdir -p app
            echo '' | base64 --decode > app/google-services.json
          fi

      # 10. DETERMINE APP VERSION & TAG
      - name: Auto-Determine Next Version Info
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LATEST_TAG=""
          
          # 1. Query latest release tag from GitHub API if token available
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            LATEST_TAG=$(curl -sSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" 2>/dev/null | grep -o '"tag_name": "[^"]*"' | head -n 1 | cut -d'"' -f4 || true)
          fi

          # 2. Fallback: Query local/remote git tags
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1 || true)
          fi

          # 3. Default base version if no previous releases exist
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0.14"
          fi

          echo "Latest found release tag: $LATEST_TAG"

          # Clean tag string
          RAW_VER="${LATEST_TAG#[vV]}"

          # Calculate next patch version automatically
          if [[ "$RAW_VER" =~ ^(.*)\.([0-9]+)$ ]]; then
            PREFIX="${BASH_REMATCH[1]}"
            LAST_NUM="${BASH_REMATCH[2]}"
            NEXT_NUM=$((LAST_NUM + 1))
            NEXT_VER="${PREFIX}.${NEXT_NUM}"
          elif [[ "$RAW_VER" =~ ^[0-9]+$ ]]; then
            NEXT_VER=$((RAW_VER + 1))
          else
            NEXT_VER="${RAW_VER}.1"
          fi

          # Ensure collision avoidance with existing git tags
          TAG_NAME="v${NEXT_VER}"
          while git rev-parse "$TAG_NAME" >/dev/null 2>&1; do
            if [[ "$NEXT_VER" =~ ^(.*)\.([0-9]+)$ ]]; then
              PREFIX="${BASH_REMATCH[1]}"
              NEXT_NUM=$((${BASH_REMATCH[2]} + 1))
              NEXT_VER="${PREFIX}.${NEXT_NUM}"
              TAG_NAME="v${NEXT_VER}"
            else
              break
            fi
          done

          VERSION_NAME="${NEXT_VER}"

          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "Auto-Generated Version Name: ${VERSION_NAME}"
          echo "Auto-Generated Release Tag: ${TAG_NAME}"

      # 11. BUILD PRODUCTION RELEASE APK
      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_PATH:-}" ] || [ ! -f "$KEYSTORE_PATH" ]; then
            echo "::error::Release keystore was not found at the expected workspace path!"
            exit 1
          fi

          STORE_PASS="${STORE_PASSWORD:-${KEYSTORE_PASSWORD:-}}"
          if [ -z "$STORE_PASS" ]; then
            echo "::error::KEYSTORE_PASSWORD or STORE_PASSWORD is missing!"
            exit 1
          fi

          KEY_PASS="${KEY_PASSWORD:-$STORE_PASS}"
          if [ -z "$KEY_PASS" ]; then
            echo "::error::KEY_PASSWORD is missing!"
            exit 1
          fi

          if [ -z "${KEY_ALIAS:-}" ]; then
            echo "::error::KEY_ALIAS is missing!"
            exit 1
          fi

          echo "Running ./gradlew clean..."
          ./gradlew clean

          echo "Building production release APK for version ${VERSION_NAME}..."

          ./gradlew assembleRelease \
            -PVERSION_NAME="${VERSION_NAME}" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      # 12. LOCATE, VERIFY, AND PROCESS APK
      - name: Verify and Process APK
        id: process_apk
        run: |
          set -euo pipefail

          VERSION_NAME="${{ steps.version.outputs.VERSION_NAME }}"

          echo "Locating generated release APK..."

          APK_PATH=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::Production release APK was not found after build!"
            exit 1
          fi

          if ! unzip -t "$APK_PATH" > /dev/null 2>&1; then
            echo "::error::The generated APK file is invalid or corrupt!"
            exit 1
          fi

          DEST_APK="Restaurant-POS-v${VERSION_NAME}.apk"

          cp "$APK_PATH" "$DEST_APK"

          echo "APK_PATH=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "Successfully verified release APK at: ${DEST_APK}"

      # 13. UPLOAD APK ARTIFACT
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release-apk
          path: ${{ steps.process_apk.outputs.APK_PATH }}
          if-no-files-found: error

      # 14. CREATE GITHUB RELEASE (ONLY ON PUSH TO MAIN)
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: "Release ${{ steps.version.outputs.TAG_NAME }}"
          body: "Restaurant POS Production Release ${{ steps.version.outputs.TAG_NAME }}"
          files: ${{ steps.process_apk.outputs.APK_PATH }}
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}